[project]
name = "market-edge-exec"
version = "0.1.0"
description = "Paper-only Nautilus/Hummingbot execution service for Market Edge (separate from the Node/Cloudflare production path)"
requires-python = ">=3.11"
dependencies = [
    "nautilus_trader",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
