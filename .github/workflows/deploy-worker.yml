name: Deploy Market Edge Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-edge-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # This is an account identifier, not a secret. Supplying it avoids the
      # optional memberships lookup, which is not granted to this deploy token.
      CLOUDFLARE_ACCOUNT_ID: 8ea7796a8fb13ffb612245e8a08a55d6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply changed D1 migrations
        run: |
          if git diff --quiet HEAD~1 HEAD -- backend/migrations; then
            echo "No D1 migrations changed in this deployment."
          else
            npx --yes wrangler@4.33.1 d1 migrations apply market-edge-research --remote --config backend/wrangler.jsonc
          fi
      - name: Deploy Worker
        run: npx --yes wrangler@4.33.1 deploy --config backend/wrangler.jsonc
