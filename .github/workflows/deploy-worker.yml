name: Deploy Market Edge Worker

on:
  workflow_dispatch:
    inputs:
      diagnostics_only:
        description: Run read-only token, account and D1 probes without deployment
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: market-edge-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # This is an account identifier, not a secret. Supplying it avoids the
      # optional memberships lookup, which is not granted to this deploy token.
      CLOUDFLARE_ACCOUNT_ID: 8ea7796a8fb13ffb612245e8a08a55d6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check D1 access
        env:
          DIAGNOSTICS_ONLY: ${{ inputs.diagnostics_only }}
        run: |
          if [ "$DIAGNOSTICS_ONLY" = "true" ]; then
            node backend/deployment-preflight.mjs --diagnose
          else
            node backend/deployment-preflight.mjs
          fi
      # Check migration history on every deployment: a failed earlier deploy
      # may leave pending migrations even when HEAD changes no SQL files.
      - name: Apply pending D1 migrations
        if: ${{ !inputs.diagnostics_only }}
        run: npx --yes wrangler@4.33.1 d1 migrations apply market-edge-research --remote --config backend/wrangler.jsonc
      - name: Verify research tables
        if: ${{ !inputs.diagnostics_only }}
        run: node backend/deployment-preflight.mjs --verify-schema
      - name: Deploy private market evaluator
        if: ${{ !inputs.diagnostics_only }}
        run: npx --yes wrangler@4.33.1 deploy --config backend/evaluator.wrangler.jsonc
      - name: Deploy public Worker
        if: ${{ !inputs.diagnostics_only }}
        run: npx --yes wrangler@4.33.1 deploy --config backend/wrangler.jsonc
