name: Deploy Market Edge Customer Beta

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'customer-beta/**'
      - '.github/workflows/deploy-customer-beta.yml'

permissions:
  contents: read

concurrency:
  group: market-edge-customer-beta-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build customer beta
        working-directory: customer-beta
        run: npm ci && npm run build
      - name: Deploy Cloudflare Pages
        run: npx --yes wrangler@4.33.1 pages deploy customer-beta/dist --project-name=market-edge-customer-beta --branch=main
