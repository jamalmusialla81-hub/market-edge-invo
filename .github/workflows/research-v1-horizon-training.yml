name: Research — V1 Horizon Training (read-only inputs, no D1 writes)

# Runs the frozen-horizon, fixed-cutoff V1 rank experiment
# (research/v1-epoch-training.mjs). It only SELECTs from D1 and reads the
# public Binance USD-M archive; it ingests one immutable research report to
# the research pipeline and never writes to historical_scan_candidates or
# any production table. Branch-only until reviewed for the daily job.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      - 'research/v1-epoch-training.mjs'
      - 'research/v0-epoch-training.mjs'
      - 'research/outcome-horizon-study.mjs'
      - 'research/historical-rank.js'
      - '.github/workflows/research-v1-horizon-training.yml'

permissions:
  contents: read

concurrency:
  group: research-v1-horizon-training
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: 8ea7796a8fb13ffb612245e8a08a55d6
      MARKET_EDGE_D1_DATABASE_ID: 39a4082e-41a4-45e9-9b76-99cf10eaca01
      HISTORICAL_RANK_ENGINE_VERSION: HISTORICAL-RANK-V1
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MARKET_EDGE_RESEARCH_TOKEN: ${{ secrets.MARKET_EDGE_RESEARCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests for the frozen-horizon / fixed-cutoff evaluator
        run: node research/v1-epoch-training.test.mjs
      - name: Run the frozen-horizon, fixed-cutoff V1 rank experiment
        run: node research/v1-epoch-training.mjs | tee v1-horizon-training.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1-horizon-training-${{ github.run_id }}
          path: v1-horizon-training.json
          if-no-files-found: error
          retention-days: 90
