name: Historical Rank Outcome Recovery

on:
  workflow_dispatch:
    inputs:
      wait_until_d1_reset:
        description: Wait for the next midnight-UTC D1 allowance reset before recovery
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '5 0 * * *'

permissions:
  contents: read

concurrency:
  group: historical-rank-v2-write
  cancel-in-progress: false

jobs:
  wait_for_d1_reset:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.wait_until_d1_reset }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Wait until shortly after the next UTC reset
        run: |
          now=$(date -u +%s)
          target=$(date -u -d 'tomorrow 00:02 UTC' +%s)
          if [ "$now" -ge "$target" ]; then
            target=$(date -u -d 'tomorrow 00:02 UTC' +%s)
          fi
          sleep "$((target-now))"

  proof:
    needs: wait_for_d1_reset
    if: ${{ always() && (needs.wait_for_d1_reset.result == 'success' || needs.wait_for_d1_reset.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8ea7796a8fb13ffb612245e8a08a55d6
      MARKET_EDGE_D1_DATABASE_ID: 39a4082e-41a4-45e9-9b76-99cf10eaca01
      MARKET_EDGE_RESEARCH_TOKEN: ${{ secrets.MARKET_EDGE_RESEARCH_TOKEN }}
      OUTCOME_RECOVERY_LIMIT: '10'
      OUTCOME_RECOVERY_REPORT: outcome-recovery-proof.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy only the research outcome-recovery endpoint
        run: npx --yes wrangler@4.33.1 deploy --config backend/wrangler.jsonc
      - name: Prove the replay status endpoint is healthy after the D1 reset
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${MARKET_EDGE_RESEARCH_TOKEN}" \
            https://market-edge-ai.jakob-market-edge.workers.dev/v1/research/replay \
            --output replay-after-reset.json
      - name: Resolve ten frozen data-gap candidates with cached Binance proxy candles
        run: node research/recover-historical-rank-outcomes.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-rank-outcome-proof
          path: |
            outcome-recovery-proof.json
            replay-after-reset.json
            research/outcome-cache
          if-no-files-found: warn
          retention-days: 90

  full_recovery:
    needs: proof
    if: ${{ always() && needs.proof.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8ea7796a8fb13ffb612245e8a08a55d6
      MARKET_EDGE_D1_DATABASE_ID: 39a4082e-41a4-45e9-9b76-99cf10eaca01
      MARKET_EDGE_RESEARCH_TOKEN: ${{ secrets.MARKET_EDGE_RESEARCH_TOKEN }}
      OUTCOME_RECOVERY_LIMIT: '500'
      OUTCOME_RECOVERY_REPORT: outcome-recovery-full.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve all remaining frozen data-gap candidates only after proof passes
        run: node research/recover-historical-rank-outcomes.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-rank-outcome-recovery
          path: |
            outcome-recovery-full.json
            research/outcome-cache
          if-no-files-found: warn
          retention-days: 90

  v0_epoch_training:
    needs: full_recovery
    if: ${{ always() && needs.full_recovery.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8ea7796a8fb13ffb612245e8a08a55d6
      MARKET_EDGE_D1_DATABASE_ID: 39a4082e-41a4-45e9-9b76-99cf10eaca01
      MARKET_EDGE_RESEARCH_TOKEN: ${{ secrets.MARKET_EDGE_RESEARCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Train V0 research models only when the resolved-rankable gate passes
        run: node research/v0-epoch-training.mjs | tee v0-epoch-training.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0-epoch-training
          path: v0-epoch-training.json
          if-no-files-found: warn
          retention-days: 90
