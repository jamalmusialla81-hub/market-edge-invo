name: Desktop app (Tauri, paper only)

# Builds, packages and tests the Market Edge desktop app.
#   tests     all suites + the real app driven on Linux (developer layout, screenshots)
#   package   per OS: freeze execution-service (PyInstaller, full nautilus_trader),
#             stage the private Node runtime + unmodified forward-loop sources,
#             real-process tests against that bundle, then .app/.dmg (Apple Silicon), .exe/.msi (x64)
#   clean-*   install the produced package on a fresh runner with Python and Node
#             REMOVED and no repository checkout, and prove the whole paper flow
# Targets: macOS Apple Silicon and Windows x64 only (Intel macOS and Linux
# installers are out of scope by decision).
# Paper only: no exchange credentials are used anywhere in this workflow.
on:
  push:
    paths:
      - 'desktop/**'
      - 'execution-service/**'
      - 'signal-bridge/**'
      - 'backend/scan-core.mjs'
      - 'quant-engine.js'
      - 'ml-engine.js'
      - 'invo-market-universe.js'
      - '.github/workflows/desktop-app.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash   # explicit bash => -eo pipefail, so `| tee` never hides a failure

env:
  PY_DEPS: nautilus_trader==1.231.0 fastapi uvicorn[standard] pydantic httpx pytest pyinstaller

jobs:
  tests:
    name: Linux — all tests + real app run (screenshots)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: System packages (webkit, virtual display)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev libdbus-1-dev xvfb openbox xdotool wmctrl imagemagick dbus-x11
      - name: execution-service deps + tests
        working-directory: execution-service
        run: |
          python -m pip install --upgrade pip
          pip install $PY_DEPS
          python -m pytest -q | tee ../pytest.log
      - name: forward-loop tests
        run: node --test signal-bridge/forward_loop.test.mjs | tee node-test.log
      - name: repo test suite (production engines, unchanged)
        run: npm test 2>&1 | tail -40 | tee repo-npm-test.log
      - name: frontend install, typecheck, tests, build
        working-directory: desktop
        run: |
          npm ci
          npm run typecheck
          npx vitest run | tee ../vitest.log
          npm run build
      - name: Rust unit tests
        working-directory: desktop/src-tauri
        run: cargo test --lib | tee ../../cargo-unit.log
      - name: Rust real-process tests (developer layout, live data)
        working-directory: desktop/src-tauri
        env:
          MARKET_EDGE_INTEGRATION: '1'
          MARKET_EDGE_PYTHON: python
        run: cargo test --test process_integration -- --nocapture --test-threads=1 2>&1 | tee ../../cargo-integration.log
      - name: Build the app binary (debug, embedded frontend)
        working-directory: desktop
        run: npx tauri build --debug --no-bundle
      - name: Drive the real app (START PAPER on live data, every screen, controls, graceful exit)
        env:
          APP: ${{ github.workspace }}/desktop/src-tauri/target/debug/market-edge-desktop
          OUT: desktop-e2e
          MARKET_EDGE_HOME: ${{ github.workspace }}
          MARKET_EDGE_PYTHON: python
          CYCLES_WAIT_S: '240'
        run: bash desktop/scripts/linux_app_e2e.sh | tee desktop-e2e.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-evidence
          path: |
            desktop-e2e/
            desktop-e2e.log
            pytest.log
            node-test.log
            repo-npm-test.log
            vitest.log
            cargo-unit.log
            cargo-integration.log
          retention-days: 90

  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest, bundles: 'app,dmg' }
          - { name: windows-x64, os: windows-latest, bundles: 'nsis,msi' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.name }}
      - name: Python deps + execution-service tests
        run: |
          python -m pip install --upgrade pip
          pip install $PY_DEPS
          cd execution-service && python -m pytest -q | tail -3
      - name: Freeze execution-service with PyInstaller (full nautilus_trader)
        run: |
          python -m PyInstaller --noconfirm --log-level WARN --distpath "$RUNNER_TEMP/pyi-dist" --workpath "$RUNNER_TEMP/pyi-work" desktop/packaging/market-edge-exec.spec
      - name: Stage app resources (frozen service, Node runtime, unmodified sources, migrations, build info)
        run: python desktop/packaging/stage_resources.py --exec-dist "$RUNNER_TEMP/pyi-dist/execution-service" | tee staging.json
      - name: Real-process tests against the staged bundle (frozen service + bundled Node, live data)
        working-directory: desktop/src-tauri
        env:
          MARKET_EDGE_INTEGRATION: '1'
          MARKET_EDGE_BUNDLE_DIR: ${{ github.workspace }}/desktop/src-tauri/bundle
          MARKET_EDGE_KEYRING_TEST: '1'
        run: |
          cargo test --lib -- --nocapture 2>&1 | tail -30 | tee ../../cargo-unit-${{ matrix.name }}.log
          cargo test --test process_integration -- --nocapture --test-threads=1 2>&1 | tee ../../cargo-bundle-${{ matrix.name }}.log
      - name: Frontend deps
        working-directory: desktop
        run: npm ci
      - name: Code signing (macOS Developer ID + notarization)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "SIGNING: SKIPPED_NOT_CONFIGURED (no APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY secrets); building an unsigned (ad-hoc) app" | tee signing.txt
            exit 0
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"; KP=$(openssl rand -hex 16)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          bash desktop/packaging/sign/macos_sign_resources.sh desktop/src-tauri/bundle
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNING: Developer ID ($APPLE_SIGNING_IDENTITY), hardened runtime" | tee signing.txt
      - name: Code signing (Windows Authenticode)
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            "SIGNING: SKIPPED_NOT_CONFIGURED (no WINDOWS_CERTIFICATE secret); building unsigned installers" | Tee-Object signing.txt
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP cert.pfx
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)
          ./desktop/packaging/sign/windows_sign_resources.ps1 -Dir desktop/src-tauri/bundle -Thumbprint $cert.Thumbprint
          '{"bundle":{"windows":{"certificateThumbprint":"' + $cert.Thumbprint + '","digestAlgorithm":"sha256","timestampUrl":"http://timestamp.digicert.com"}}}' | Out-File -Encoding utf8NoBOM desktop/src-tauri/tauri.signing.conf.json
          "SIGNING: Authenticode $($cert.Subject)" | Tee-Object signing.txt
      - name: Build installers (${{ matrix.bundles }})
        working-directory: desktop
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          [ -n "${APPLE_ID:-}" ] || unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID   # no notarization without credentials
          EXTRA=""
          [ -f src-tauri/tauri.signing.conf.json ] && EXTRA="--config src-tauri/tauri.signing.conf.json"
          npx tauri build --bundles ${{ matrix.bundles }} --config src-tauri/tauri.bundle.conf.json $EXTRA
      - name: Collect installers + clean-machine kit
        run: |
          mkdir -p dist-out/kit
          B=desktop/src-tauri/target/release/bundle
          case "${{ runner.os }}" in
            macOS)
              cp "$B"/dmg/*.dmg dist-out/
              tar -C "$B/macos" -czf "dist-out/Market Edge.app.tar.gz" "Market Edge.app"
              codesign -dv --verbose=2 "$B/macos/Market Edge.app" 2>&1 | tee dist-out/codesign.txt || true
              lipo -archs "$B/macos/Market Edge.app/Contents/MacOS/"* | tee dist-out/archs.txt
              file "$B/macos/Market Edge.app/Contents/Resources/execution-service/market-edge-exec" "$B/macos/Market Edge.app/Contents/Resources/runtime/node" | tee -a dist-out/archs.txt ;;
            Windows)
              cp "$B"/nsis/*.exe "$B"/msi/*.msi dist-out/ ;;
          esac
          cp desktop/packaging/clean-machine/*.sh dist-out/kit/
          cp execution-service/tests/fixtures/legacy_v0.sqlite3 dist-out/kit/
          cp staging.json signing.txt dist-out/ 2>/dev/null || true
          ls -la dist-out
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: dist-out/
          retention-days: 30
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-logs-${{ matrix.name }}
          path: |
            staging.json
            signing.txt
            cargo-unit-${{ matrix.name }}.log
            cargo-bundle-${{ matrix.name }}.log
          retention-days: 30

  clean-macos:
    name: Clean machine ${{ matrix.name }} (no Python, no Node, no repo)
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest }
    steps:
      # deliberately NO actions/checkout: the repository never exists on this machine
      - uses: actions/download-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: pkg
      - name: Remove every Python and Node from the machine
        run: |
          sudo rm -rf /Library/Frameworks/Python.framework /opt/hostedtoolcache/Python /opt/hostedtoolcache/node "$RUNNER_TOOL_CACHE/Python" "$RUNNER_TOOL_CACHE/node" || true
          for d in /usr/local/bin /opt/homebrew/bin; do
            sudo rm -f $d/python* $d/pip* $d/node $d/npm $d/npx $d/corepack 2>/dev/null || true
          done
          echo "left on PATH:"; for t in python python3 pip pip3 node npm; do command -v $t || true; done
          uname -m
      - name: Install from the DMG
        run: |
          MNT=$(hdiutil attach -nobrowse -readonly pkg/*.dmg | tail -1 | awk -F'\t' '{print $NF}')
          cp -R "$MNT/Market Edge.app" /Applications/
          hdiutil detach "$MNT"
          ls "/Applications/Market Edge.app/Contents/Resources"
      - name: Installed-app test (live data, paper trade, crash, restart, backup, migration)
        run: |
          APP="/Applications/Market Edge.app/Contents/MacOS/$(ls "/Applications/Market Edge.app/Contents/MacOS" | head -1)"
          cd "$RUNNER_TEMP" && OUT="$GITHUB_WORKSPACE/evidence-dmg" FIXTURE="$GITHUB_WORKSPACE/pkg/kit/legacy_v0.sqlite3" \
            bash "$GITHUB_WORKSPACE/pkg/kit/clean_machine_test.sh" macos "$APP" "/Applications/Market Edge.app" ${{ matrix.name }}-dmg
      - name: Update in place from the .app artifact (state must survive)
        if: always()
        run: |
          rm -rf "/Applications/Market Edge.app"
          tar -C /Applications -xzf "pkg/Market Edge.app.tar.gz"
          APP="/Applications/Market Edge.app/Contents/MacOS/$(ls "/Applications/Market Edge.app/Contents/MacOS" | head -1)"
          cd "$RUNNER_TEMP" && OUT="$GITHUB_WORKSPACE/evidence-app" FIXTURE="" TRADE_WAIT_S=120 PREVIOUS_STATUS="$GITHUB_WORKSPACE/evidence-dmg/final-state.json" \
            bash "$GITHUB_WORKSPACE/pkg/kit/clean_machine_test.sh" macos "$APP" "/Applications/Market Edge.app" ${{ matrix.name }}-app
      - name: Same installed app and data with market data unreachable (offline start)
        if: always()
        run: |
          # every exchange host the bundled code talks to resolves to a dead local address
          for h in api.hyperliquid.xyz api.exchange.coinbase.com api.binance.com; do
            printf '127.0.0.1 %s\n::1 %s\n' "$h" "$h" | sudo tee -a /etc/hosts >/dev/null
          done
          sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder || true
          APP="/Applications/Market Edge.app/Contents/MacOS/$(ls "/Applications/Market Edge.app/Contents/MacOS" | head -1)"
          cd "$RUNNER_TEMP" && OUT="$GITHUB_WORKSPACE/evidence-app" bash "$GITHUB_WORKSPACE/pkg/kit/offline_test.sh" "$APP" ${{ matrix.name }}
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-evidence-${{ matrix.name }}
          path: |
            evidence-dmg/
            evidence-app/
          retention-days: 90

  clean-windows:
    name: Clean machine windows-x64 (no Python, no Node, no repo)
    needs: package
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # deliberately NO actions/checkout
      - uses: actions/download-artifact@v4
        with:
          name: installer-windows-x64
          path: pkg
      - name: Remove every Python and Node from the machine
        shell: pwsh
        run: |
          $dirs = @("$env:RUNNER_TOOL_CACHE\Python", "$env:RUNNER_TOOL_CACHE\node", "C:\Program Files\nodejs", "C:\npm", "$env:APPDATA\npm")
          foreach ($d in $dirs) { if (Test-Path $d) { Remove-Item -Recurse -Force $d -ErrorAction SilentlyContinue; if (Test-Path $d) { Rename-Item $d "$d.removed" -ErrorAction SilentlyContinue } } }
          Get-ChildItem "C:\Python*" -Directory -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:LOCALAPPDATA\Microsoft\WindowsApps\python*.exe" -Force -ErrorAction SilentlyContinue
          Get-ChildItem C:\ProgramData\chocolatey\bin -Filter "python*" -ErrorAction SilentlyContinue | Remove-Item -Force
          $clean = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'python|nodejs|\\node\\|npm|hostedtoolcache' }) -join ';'
          "PATH=$clean" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "left:"; Get-Command python,python3,node,npm,pip -ErrorAction SilentlyContinue | Select-Object Source
      - name: Install with the NSIS .exe (silent, current user)
        shell: pwsh
        run: |
          $exe = Get-ChildItem pkg -Filter *-setup.exe | Select-Object -First 1
          Start-Process -FilePath $exe.FullName -ArgumentList '/S' -Wait
          Get-ChildItem "$env:LOCALAPPDATA\Market Edge" | Select-Object Name
      - name: Installed-app test from the .exe install
        run: |
          ROOT="$(cygpath -u "$LOCALAPPDATA")/Market Edge"
          APP=$(ls "$ROOT"/*.exe | grep -viE 'uninstall' | head -1)
          cd "$RUNNER_TEMP" && OUT="$(cygpath -u "$GITHUB_WORKSPACE")/evidence-exe" FIXTURE="$(cygpath -u "$GITHUB_WORKSPACE")/pkg/kit/legacy_v0.sqlite3" \
            bash "$(cygpath -u "$GITHUB_WORKSPACE")/pkg/kit/clean_machine_test.sh" windows "$APP" "$ROOT" windows-x64-exe
      - name: Uninstall the .exe build (user data must stay), install the .msi
        if: always()
        shell: pwsh
        run: |
          $un = Get-ChildItem "$env:LOCALAPPDATA\Market Edge" -Filter "uninstall*.exe" | Select-Object -First 1
          if ($un) { Start-Process -FilePath $un.FullName -ArgumentList '/S' -Wait }
          Start-Sleep 5
          "app data after uninstall:"; Get-ChildItem "$env:APPDATA\Market Edge" | Select-Object Name
          $msi = Get-ChildItem pkg -Filter *.msi | Select-Object -First 1
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$($msi.FullName)`" /qn /l*v `"$env:GITHUB_WORKSPACE\msi-install.log`"" -Wait -PassThru
          "msiexec exit $($p.ExitCode)"
          Get-Content "$env:GITHUB_WORKSPACE\msi-install.log" -Tail 80
          # WiX's default INSTALLDIR nests under ROOTDRIVE, which the installer engine
          # picks as the fixed drive with the most free space at install time -- not
          # necessarily the OS drive on a multi-drive CI runner. Find the real install
          # dir from the registry rather than assuming C:\Program Files.
          $uninstKey = Get-ChildItem 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall','HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue |
            Get-ItemProperty | Where-Object { $_.DisplayName -eq 'Market Edge' } | Select-Object -First 1
          $installDir = $uninstKey.InstallLocation
          if (-not $installDir -or -not (Test-Path $installDir)) { throw "msiexec exit $($p.ExitCode) but no InstallLocation found in the registry for Market Edge" }
          "installed at: $installDir"
          Get-ChildItem $installDir | Select-Object Name
          "MSI_INSTALL_DIR=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Installed-app test from the .msi install (existing user data must be kept)
        if: always()
        run: |
          ROOT="$(cygpath -u "$MSI_INSTALL_DIR")"
          APP=$(ls "$ROOT"/*.exe | grep -viE 'uninstall' | head -1)
          cd "$RUNNER_TEMP" && OUT="$(cygpath -u "$GITHUB_WORKSPACE")/evidence-msi" FIXTURE="" TRADE_WAIT_S=120 PREVIOUS_STATUS="$(cygpath -u "$GITHUB_WORKSPACE")/evidence-exe/final-state.json" \
            bash "$(cygpath -u "$GITHUB_WORKSPACE")/pkg/kit/clean_machine_test.sh" windows "$APP" "$ROOT" windows-x64-msi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-evidence-windows-x64
          path: |
            evidence-exe/
            evidence-msi/
            msi-install.log
          retention-days: 90
