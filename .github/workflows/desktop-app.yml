name: Desktop app (Tauri, paper only)

# Builds and tests the Market Edge desktop shell on Linux, macOS and Windows.
# Paper only: no exchange credentials are used anywhere in this workflow.
on:
  push:
    paths:
      - 'desktop/**'
      - 'execution-service/**'
      - 'signal-bridge/**'
      - '.github/workflows/desktop-app.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash   # explicit bash => -eo pipefail, so `| tee` never hides a failure

jobs:
  linux:
    name: Linux — all tests + real app run (screenshots)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: System packages (webkit, virtual display)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev libdbus-1-dev xvfb openbox xdotool wmctrl imagemagick dbus-x11
      - name: execution-service deps + tests
        working-directory: execution-service
        run: |
          python -m pip install --upgrade pip
          pip install nautilus_trader fastapi "uvicorn[standard]" pydantic httpx pytest
          python -m pytest -q | tee ../pytest.log
      - name: forward-loop tests
        run: node --test signal-bridge/forward_loop.test.mjs | tee node-test.log
      - name: frontend install, typecheck, tests, build
        working-directory: desktop
        run: |
          npm ci
          npm run typecheck
          npx vitest run | tee ../vitest.log
          npm run build
      - name: Rust unit tests
        working-directory: desktop/src-tauri
        run: cargo test --lib | tee ../../cargo-unit.log
      - name: Rust real-process integration test (real service + real forward-loop cycle on live data)
        working-directory: desktop/src-tauri
        env:
          MARKET_EDGE_INTEGRATION: '1'
          MARKET_EDGE_PYTHON: python
        run: cargo test --test process_integration -- --nocapture 2>&1 | tee ../../cargo-integration.log
      - name: Build the app binary (debug, embedded frontend)
        working-directory: desktop
        run: npx tauri build --debug --no-bundle
      - name: Drive the real app (START PAPER on live data, every screen, controls, graceful exit)
        env:
          APP: ${{ github.workspace }}/desktop/src-tauri/target/debug/market-edge-desktop
          OUT: desktop-e2e
          MARKET_EDGE_HOME: ${{ github.workspace }}
          MARKET_EDGE_PYTHON: python
          CYCLES_WAIT_S: '240'
        run: bash desktop/scripts/linux_app_e2e.sh | tee desktop-e2e.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-evidence
          path: |
            desktop-e2e/
            desktop-e2e.log
            pytest.log
            node-test.log
            vitest.log
            cargo-unit.log
            cargo-integration.log
          retention-days: 90

  macos:
    name: macOS — .app/.dmg build, Keychain, process management
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: execution-service deps
        run: |
          python -m pip install --upgrade pip
          pip install nautilus_trader fastapi "uvicorn[standard]" pydantic httpx pytest
      - name: Frontend deps
        working-directory: desktop
        run: npm ci
      - name: Rust tests incl. real macOS Keychain round trip
        working-directory: desktop/src-tauri
        env:
          MARKET_EDGE_KEYRING_TEST: '1'
        run: cargo test --lib -- --nocapture 2>&1 | tee ../../cargo-macos.log
      - name: Real-process integration test on macOS
        working-directory: desktop/src-tauri
        env:
          MARKET_EDGE_INTEGRATION: '1'
          MARKET_EDGE_PYTHON: python
        run: cargo test --test process_integration -- --nocapture 2>&1 | tee ../../cargo-integration-macos.log
      - name: Build Market Edge.app + DMG (unsigned)
        working-directory: desktop
        run: npx tauri build --bundles app,dmg
      - name: Launch the built .app and confirm it starts the execution-service
        env:
          APP: ${{ github.workspace }}/desktop/src-tauri/target/release/bundle/macos/Market Edge.app/Contents/MacOS/market-edge-desktop
          MARKET_EDGE_HOME: ${{ github.workspace }}
          MARKET_EDGE_PYTHON: python
        run: bash desktop/scripts/launch_smoke.sh
      - name: Upload macOS build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-edge-macos
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            cargo-macos.log
            cargo-integration-macos.log
            app-smoke.log
            smoke-health.json
          retention-days: 30

  windows:
    name: Windows — .exe/.msi installers, Credential Manager, process management
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: execution-service deps
        run: |
          python -m pip install --upgrade pip
          pip install nautilus_trader fastapi "uvicorn[standard]" pydantic httpx pytest
      - name: Frontend deps
        working-directory: desktop
        run: npm ci
      - name: Rust tests incl. real Windows Credential Manager round trip
        working-directory: desktop/src-tauri
        env:
          MARKET_EDGE_KEYRING_TEST: '1'
        run: cargo test --lib -- --nocapture 2>&1 | tee ../../cargo-windows.log
      - name: Real-process integration test on Windows
        working-directory: desktop/src-tauri
        env:
          MARKET_EDGE_INTEGRATION: '1'
          MARKET_EDGE_PYTHON: python
        run: cargo test --test process_integration -- --nocapture 2>&1 | tee ../../cargo-integration-windows.log
      - name: Build Market Edge .exe (NSIS) + .msi installers (unsigned)
        working-directory: desktop
        run: npx tauri build --bundles nsis,msi
      - name: Launch the built exe and confirm it starts the execution-service
        env:
          APP: ${{ github.workspace }}/desktop/src-tauri/target/release/market-edge-desktop.exe
          MARKET_EDGE_HOME: ${{ github.workspace }}
          MARKET_EDGE_PYTHON: python
        run: bash desktop/scripts/launch_smoke.sh
      - name: Upload Windows installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-edge-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            cargo-windows.log
            cargo-integration-windows.log
            app-smoke.log
            smoke-health.json
          retention-days: 30
