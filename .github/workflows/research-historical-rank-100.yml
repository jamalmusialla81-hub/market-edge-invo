name: Historical Rank V2 — 100 Scan Checkpoint

on:
  workflow_dispatch:
    inputs:
      wait_for_d1_reset:
        description: 'Wait for the next UTC D1 daily-limit reset before replaying'
        required: false
        type: boolean
        default: false
  # A failed/incomplete checkpoint caused by D1's daily free-tier read budget
  # resumes unattended after the next reset. Completed scan IDs are skipped.
  schedule:
    - cron: '10 0 * * *'

permissions:
  contents: read

# The runner uses deterministic scan and candidate IDs plus immutable INSERT OR
# IGNORE writes, so batches could be independent.  We deliberately run one at
# a time: it makes snapshot→outcome ordering auditable and avoids avoidable D1
# API contention.  Rerunning this workflow resumes by skipping terminal scans.
concurrency:
  group: historical-rank-v2-write
  cancel-in-progress: false

jobs:
  wait_for_d1_reset:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.wait_for_d1_reset }}
    name: Wait for the D1 daily-limit reset
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Wait until shortly after midnight UTC
        shell: bash
        run: |
          now=$(date -u +%s)
          next=$(date -u -d 'tomorrow 00:01 UTC' +%s)
          delay=$((next - now))
          echo "D1 free-tier row-read quota reset wait: ${delay}s"
          sleep "$delay"

  replay:
    needs: [wait_for_d1_reset]
    if: ${{ always() }}
    name: Historical chunk ${{ matrix.batch }} (offset ${{ matrix.start_index }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          # Offsets 0..8 already have immutable terminal snapshots. Resume
          # exactly at 9 and finish the 100-scan checkpoint (offset 0..99).
          - { batch: 1, start_index: 9, scan_count: 4 }
          - { batch: 2, start_index: 13, scan_count: 4 }
          - { batch: 3, start_index: 17, scan_count: 4 }
          - { batch: 4, start_index: 21, scan_count: 4 }
          - { batch: 5, start_index: 25, scan_count: 4 }
          - { batch: 6, start_index: 29, scan_count: 4 }
          - { batch: 7, start_index: 33, scan_count: 4 }
          - { batch: 8, start_index: 37, scan_count: 4 }
          - { batch: 9, start_index: 41, scan_count: 4 }
          - { batch: 10, start_index: 45, scan_count: 4 }
          - { batch: 11, start_index: 49, scan_count: 4 }
          - { batch: 12, start_index: 53, scan_count: 4 }
          - { batch: 13, start_index: 57, scan_count: 4 }
          - { batch: 14, start_index: 61, scan_count: 4 }
          - { batch: 15, start_index: 65, scan_count: 4 }
          - { batch: 16, start_index: 69, scan_count: 4 }
          - { batch: 17, start_index: 73, scan_count: 4 }
          - { batch: 18, start_index: 77, scan_count: 4 }
          - { batch: 19, start_index: 81, scan_count: 4 }
          - { batch: 20, start_index: 85, scan_count: 4 }
          - { batch: 21, start_index: 89, scan_count: 4 }
          - { batch: 22, start_index: 93, scan_count: 4 }
          - { batch: 23, start_index: 97, scan_count: 3 }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8ea7796a8fb13ffb612245e8a08a55d6
      MARKET_EDGE_D1_DATABASE_ID: 39a4082e-41a4-45e9-9b76-99cf10eaca01
      MARKET_EDGE_RESEARCH_TOKEN: ${{ secrets.MARKET_EDGE_RESEARCH_TOKEN }}
      HISTORICAL_RANK_PILOT_SCANS: ${{ matrix.scan_count }}
      HISTORICAL_RANK_START_INDEX: ${{ matrix.start_index }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Freeze one deterministic historical chunk, then resolve only its later outcomes
        run: node research/run-historical-rank-pilot.mjs

  audit:
    name: Final 100-scan immutable audit
    needs: replay
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8ea7796a8fb13ffb612245e8a08a55d6
      MARKET_EDGE_D1_DATABASE_ID: 39a4082e-41a4-45e9-9b76-99cf10eaca01
      HISTORICAL_RANK_EXPECTED_SCANS: '100'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Report the immutable 100-scan checkpoint (no model training)
        run: node research/historical-rank-report.mjs
